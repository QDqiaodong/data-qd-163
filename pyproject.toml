[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "data-qd-163"
version = "0.1.0"
description = "Bounded recurring local schedules across daylight-saving transitions"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
calendar-expand = "calendar_expand.cli:main"
calendar-admit = "calendar_expand.admit_cli:main"
calendar-reconcile = "calendar_expand.reconcile_cli:main"
calendar-reminders = "calendar_expand.reminders_cli:main"
calendar-workload = "calendar_expand.workload_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
